        /* Контейнер визитки */
        .container {
            width: 100%;
            max-width: 430px;

        }

        h1 {

        }

            color: #d1c2b7;
            margin-bottom: 30px;

        }

        .links-container {
            display: flex;
            flex-direction: column;

        }

        /* Базовый стиль для всех кнопок */
        .link-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 122, 0, 0.15);
            border-radius: 14px;
            padding: 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(5px);
            position: relative;
        }

        /* Базовый стиль для SVG-иконок всех кнопок */
        .link-card svg {
                width: 20px;
                height: 20px;
                transition: filter 0.25s ease, transform 0.25s ease;
        }
        .link-card:hover svg,
        .link-card:hover img {
                filter: brightness(0) invert(1) !important;
}
        /* Чуть увеличиваем иконку при наведении */
        .link-card:hover svg {
                transform: scale(1.1);
}

        /* Индивидуальная подсветка кнопок при наведении */
        .tg-btn svg { fill: #24A1DE; }
        /* Цвет иконки Telegram */
        .tg-btn:hover {
                background: #24A1DE;
                border-color: #24A1DE;
                box-shadow: 0 6px 20px rgba(36, 161, 222, 0.4);
        }

        .tt-btn svg { fill: #fa69be; }  
        /* Цвет иконки TikTok */
        .tt-btn:hover {
                background: #010101;
                border-color: #fe2c55;
                box-shadow: -3px 0 10px rgba(37, 244, 238, 0.5), 3px 0 10px rgba(254, 44, 85, 0.5);
}
        .insta-btn svg { fill: #dc2743; }
        /* Цвет иконки Instagram */
        .insta-btn:hover {
                background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
                border-color: #dc2743;
                box-shadow: 0 6px 20px rgba(220, 39, 67, 0.4);
}
        .yt-btn svg { fill: #FF0000; } 
        /* Цвет иконки YouTube */
        .yt-btn:hover {
                background: #FF0000;
                border-color: #FF0000;
                box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
}
        .da-btn:hover {
            background: #F47321;
            border-color: #F47321;
            box-shadow: 0 6px 20px rgba(244, 115, 33, 0.4);
        }

        /* Стили для нового логотипа донатов */
        .da-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            transition: filter 0.25s ease;
        }

        /* Делаем черный логотип белым при наведении на кнопку */
        .da-btn:hover img {
            filter: brightness(0) invert(1);
        }

        .boosty-btn:hover {
            background: #ff5e00;
            border-color: #ff5e00;
            box-shadow: 0 6px 20px rgba(255, 94, 0, 0.4);
        }

        /* Вырезаем только значок из полного логотипа и делаем его оранжевым */
        .boosty-btn .boosty-icon-wrapper img {
            height: 20px;
            width: auto;
            max-width: none;
            object-fit: contain;            
            transition: filter 0.25s ease;
            
        /* Этот фильтр превращает черную иконку Boosty в оранжевую (#ff5e00) */
            filter: invert(41%) sepia(81%) saturate(5437%) hue-rotate(11deg) brightness(101%) contrast(105%);
}
        
        /* 1. Цвет только для самой SVG-иконки Твича */
        .twitch-card svg { 
            fill: #a155ff; 
}
        /* 2. Стили для всей карточки Твича */
        .twitch-card {
            background: rgba(161, 85, 255, 0.1);
            border: 2px solid #a155ff;
            box-shadow: 0 0 10px rgba(161, 85, 255, 0.3), inset 0 0 10px rgba(161, 85, 255, 0.2);
}

        
        .twitch-card:hover {
            background: #a155ff;
            border-color: #a155ff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(161, 85, 255, 0.7), 0 0 40px rgba(161, 85, 255, 0.4);
        }

        /* Пульсирующий индикатор LIVE */
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ff3333;
            position: absolute;
            right: 16px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #ff3333;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(255, 51, 51, 0);
            }
            100% {
                transform: scale(0.9);
                box-shadow: 0 0 0 0 rgba(255, 51, 51, 0);
            }
        }

        /* Небольшое смещение при наведении на все обычные кнопки */
        .link-card:not(.twitch-card):hover {
            transform: translateY(-2px);
        }
        h1 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
        }
